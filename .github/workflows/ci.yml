name: ci

on:
  pull_request:
    branches: [main]

jobs:
  tests:
    name: Tests
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v6

      - name: Print node version
        run: node --version

      - name: Install dependencies
        run: npm ci

      - name: run tests
        run: npm run test